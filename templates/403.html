{% extends "base.html" %}

{% block title %}
Error 403
{% endblock %}

{% block content %}

<div class="error-page">
    <div class="error-code">
        403
    </div>
    <h1>
        Acceso prohibido
    </h1>
    <p>
        No tienes permisos para realizar
        esta acción.
    </p>
    <a
        href="{{ url_for('index') }}"
        class="btn btn-secondary"
    >
        Volver al inicio
    </a>
</div>

{% endblock %}
