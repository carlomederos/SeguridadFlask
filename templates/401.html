{% extends "base.html" %}

{% block title %}
Error 401
{% endblock %}

{% block content %}

<div class="error-page">
    <div class="error-code">
        401
    </div>
    <h1>
        No autorizado
    </h1>
    <p>
        Debes iniciar sesión para acceder
        a este recurso.
    </p>
    <a
        href="{{ url_for('login') }}"
        class="btn btn-primary"
    >
        Iniciar sesión
    </a>
</div>

{% endblock %}
