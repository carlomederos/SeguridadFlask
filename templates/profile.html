{% extends "base.html" %}

{% block title %}
Mi perfil
{% endblock %}

{% block content %}

<div class="profile-card">

    <div class="profile-header">
        <div class="avatar">
            {{ current_user.username[0]|upper }}
        </div>
        <h1>
            {{ current_user.username|capitalize }}
        </h1>
        <p>
            Usuario autenticado
        </p>
    </div>

    <div class="profile-row">
        <strong>
            ID de usuario
        </strong>
        {{ current_user.id }}
    </div>

    <div class="profile-row">
        <strong>
            Usuario
        </strong>
        {{ current_user.username }}
    </div>
</div>

{% endblock %}
